# CI runs `pytest` from the repo root. Most `test_*.py` files in this repo are
# demo / integration scripts that need live services and API keys (LLM
# providers, vector DBs, llama-stack, watsonx ...), so they cannot run in CI.
# Only offline unit tests are collected here; add their directories below.
[pytest]
testpaths =
    llm-d/tokeneconomics/tests
pythonpath =
    llm-d/tokeneconomics
