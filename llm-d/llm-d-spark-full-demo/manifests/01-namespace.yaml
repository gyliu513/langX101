apiVersion: v1
kind: Namespace
metadata:
  name: llm-d
---
# ServiceAccount the model-server Pods run as (the router chart with
# provider.name=none does not create one). Nothing in the Pods talks to the
# K8s API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa
  namespace: llm-d
  labels:
    app.kubernetes.io/part-of: llm-d
automountServiceAccountToken: false
