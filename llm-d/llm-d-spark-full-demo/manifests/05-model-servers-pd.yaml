---
# P/D-disaggregated pool. Model servers are llm-d-inference-sim, NOT vLLM:
# real vLLM P/D needs the NIXL KV connector, which cannot initialize on the
# DGX Spark (see manifests/optional-05-model-servers-pd-vllm-nixl.yaml and
# the README). What IS real here: the P/D EPP's disagg scheduling (two
# scheduling profiles, prefill + decode endpoints picked per request) and the
# llm-d routing sidecar's two-leg proxying (prefill leg -> decode leg). Only
# the KV transfer itself is faked by the sim.
#
# Both Deployments carry llm-d.ai/guide=pd-disaggregation (the llm-d-pd
# InferencePool selector) and differ by llm-d.ai/role, which the EPP's
# prefill-filter / decode-filter use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-prefill
  namespace: llm-d
  labels:
    app: pd-prefill
    llm-d.ai/role: prefill
    llm-d.ai/guide: pd-disaggregation
    llm-d.ai/model: Qwen2.5-1.5B-Instruct
    app.kubernetes.io/part-of: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-prefill
      llm-d.ai/guide: pd-disaggregation
  template:
    metadata:
      labels:
        app: pd-prefill
        llm-d.ai/role: prefill
        llm-d.ai/guide: pd-disaggregation
        llm-d.ai/model: Qwen2.5-1.5B-Instruct
        app.kubernetes.io/part-of: llm-d
    spec:
      serviceAccountName: sa
      containers:
        - name: modelserver
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.0   # multi-arch
          imagePullPolicy: IfNotPresent
          args:
            - "--model=Qwen/Qwen2.5-1.5B-Instruct"
            - "--port=8000"
            - "--kv-cache-size=4096"
            - "--block-size=64"
            - "--enable-kvcache"
            # sim >= v0.9 tokenizes its sentence bank against a render service
            # at startup; without this it crash-loops on "connection refused".
            - "--force-dummy-tokenizer"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OTEL_SERVICE_NAME
              value: "llm-d-model-server-prefill"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
            - name: nixl
              containerPort: 5600
              protocol: TCP
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-decode
  namespace: llm-d
  labels:
    app: pd-decode
    llm-d.ai/role: decode
    llm-d.ai/guide: pd-disaggregation
    llm-d.ai/model: Qwen2.5-1.5B-Instruct
    app.kubernetes.io/part-of: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-decode
      llm-d.ai/guide: pd-disaggregation
  template:
    metadata:
      labels:
        app: pd-decode
        llm-d.ai/role: decode
        llm-d.ai/guide: pd-disaggregation
        llm-d.ai/model: Qwen2.5-1.5B-Instruct
        app.kubernetes.io/part-of: llm-d
    spec:
      serviceAccountName: sa
      initContainers:
        # llm-d routing sidecar as a native sidecar (restartPolicy: Always).
        # It owns the Pod's :8000 (the InferencePool target port), receives the
        # request the EPP routed here with an `x-prefiller-host-port` header,
        # sends the prefill leg to that prefill Pod (max_tokens=1 +
        # kv_transfer_params), then the decode leg to the local model server
        # on :8200.
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0   # multi-arch
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - --port=8000
            - --model-server-port=8200
            - --kv-connector=nixlv2
            - --zap-log-level=1
            - --secure-proxy=false
            # Emits the sidecar's own spans (prefill leg + decode leg) and
            # propagates W3C trace context to both model servers.
            - --tracing=true
          env:
            - name: OTEL_SERVICE_NAME
              value: "llm-d-routing-sidecar"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          ports:
            - name: sidecar
              containerPort: 8000
              protocol: TCP
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      containers:
        - name: modelserver
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.0
          imagePullPolicy: IfNotPresent
          args:
            - "--model=Qwen/Qwen2.5-1.5B-Instruct"
            - "--port=8200"
            - "--kv-cache-size=4096"
            - "--block-size=64"
            - "--enable-kvcache"
            - "--force-dummy-tokenizer"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OTEL_SERVICE_NAME
              value: "llm-d-model-server-decode"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          ports:
            - name: modelserver
              containerPort: 8200
              protocol: TCP
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet:
              path: /v1/models
              port: modelserver
            initialDelaySeconds: 5
            periodSeconds: 10
