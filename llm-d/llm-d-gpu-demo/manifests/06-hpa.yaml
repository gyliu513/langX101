---
# HPA that scales optimized-baseline-decode from WVA's published
# desired-replica metric. Annotation-based WVA discovery -- no
# VariantAutoscaling CR (deprecated upstream). See
# project_llmd_full_demo_main_rerun_2026_08 memory / llm-d-full-demo README
# "Step 9" for the full WVA install chain this depends on.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: optimized-baseline-decode-hpa
  namespace: llm-d
  annotations:
    llm-d.ai/managed: "true"
    llm-d.ai/model-id: "Qwen/Qwen2.5-1.5B-Instruct"
    llm-d.ai/variant-cost: "10.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: optimized-baseline-decode
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 10
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
  metrics:
    - type: External
      external:
        metric:
          name: wva_desired_replicas
          selector:
            matchLabels:
              variant_name: optimized-baseline-decode-hpa
              exported_namespace: llm-d
        target:
          type: AverageValue
          averageValue: "1"
