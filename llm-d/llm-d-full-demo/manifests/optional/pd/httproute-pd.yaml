# Routes only requests carrying `x-llm-d-pool: pd` to the P/D InferencePool,
# so the P/D path coexists with the default precise-prefix path on one Gateway.
#
# Gateway API precedence: a rule with a header match is more specific than the
# default chart route's bare `/` PathPrefix, so this wins for tagged requests and
# everything else still reaches the `llm-d` pool.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-pd
  namespace: llm-d
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: Exact
              name: x-llm-d-pool
              value: pd
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: llm-d-pd
          weight: 1
      timeouts:
        request: 300s
