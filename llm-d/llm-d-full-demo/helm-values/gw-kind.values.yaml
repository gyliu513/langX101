router:
  epp:
    replicas: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker-dev
      tag: main
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits:   { cpu: "2", memory: "2Gi" }
    flags:
      v: 2
  # The vllm-render sidecar only tokenizes for the token-producer, but the chart
  # defaults it to 4 CPU / 8Gi -- on a single Kind node that alone blocks the
  # second model-server replica from scheduling ("Insufficient memory").
  tokenizer:
    resources:
      requests: { cpu: "500m", memory: "2Gi" }
      limits:   { cpu: "2", memory: "4Gi" }
  modelServers:
    matchLabels:
      llm-d.ai/guide: "precise-prefix-cache-routing"
