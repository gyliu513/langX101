global:
  scrape_interval: 5s
  evaluation_interval: 15s

# The upstream llm-d Grafana dashboards were written for Kubernetes and group /
# filter by `namespace`, `pod` and `job`. Outside Kubernetes nothing sets those,
# so we synthesize them with static labels + relabeling.
scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels: {namespace: bare-metal, pod: vllm-0, llm_d_role: decode}
      - targets: ["127.0.0.1:8001"]
        labels: {namespace: bare-metal, pod: vllm-1, llm_d_role: decode}

  - job_name: llm-d-epp
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: {namespace: bare-metal, pod: epp}

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["127.0.0.1:19000"]
        labels: {namespace: bare-metal, pod: envoy}

  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:8888"]
        labels: {namespace: bare-metal, pod: otel-collector}

  - job_name: spanmetrics
    static_configs:
      - targets: ["127.0.0.1:8889"]
        labels: {namespace: bare-metal}
