# Multi-node kind cluster: 1 control-plane + 2 workers.
# The RayJob creates 1 head pod + 2 worker pods (plus a small submitter pod),
# which the scheduler spreads across the two worker nodes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kueue-rayjob-demo
nodes:
  - role: control-plane
  - role: worker
  - role: worker
